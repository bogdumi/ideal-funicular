<!DOCTYPE html>

  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="theme-color" content="#ECE7D9" />

    <script type="text/javascript">
      // Apply the stored (or default) theme before first paint, so there's no
      // flash of the wrong theme. Mirrored by libs/shared's theme.tsx at runtime.
      // Two independent themes: the main site follows the OS preference by
      // default, Contact Sheet always defaults to dark until chosen otherwise.
      ;(function () {
        try {
          var stored = localStorage.getItem('theme')
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
          document.documentElement.setAttribute('data-theme', theme)

          var storedPhoto = localStorage.getItem('photo-theme')
          var photoTheme = storedPhoto === 'light' || storedPhoto === 'dark' ? storedPhoto : 'dark'
          document.documentElement.setAttribute('data-photo-theme', photoTheme)
        } catch (e) {}
      })()
    </script>

    <script type="text/javascript">
      // Counterpart to public/404.html's redirect: decode the real path back
      // out of the query string before the router mounts.
      ;(function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&')
            })
            .join('?')
          window.history.replaceState(null, '', l.pathname.slice(0, -1) + decoded + l.hash)
        }
      })(window.location)
    </script>
