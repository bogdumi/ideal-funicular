<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Placeholder cover: a rain-streaked window overlooking blurred city lights at night.">
  <defs>
    <radialGradient id="bokeh1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A9873F" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#A9873F" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="bokeh2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#96281B" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#96281B" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="vignette" cx="50%" cy="42%" r="75%">
      <stop offset="55%" stop-color="#0C0C0D" stop-opacity="0" />
      <stop offset="100%" stop-color="#0C0C0D" stop-opacity="0.85" />
    </radialGradient>
    <filter id="blur1"><feGaussianBlur stdDeviation="26" /></filter>
    <filter id="blur2"><feGaussianBlur stdDeviation="14" /></filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch" result="noise" />
      <feColorMatrix in="noise" type="matrix" values="0 0 0 0 0.97  0 0 0 0 0.95  0 0 0 0 0.91  0 0 0 0.05 0" />
    </filter>
  </defs>

  <rect width="1200" height="800" fill="#0C0C0D" />

  <g filter="url(#blur1)">
    <circle cx="880" cy="260" r="130" fill="url(#bokeh1)" />
    <circle cx="990" cy="420" r="90" fill="url(#bokeh2)" />
    <circle cx="760" cy="470" r="70" fill="url(#bokeh1)" />
  </g>
  <g filter="url(#blur2)">
    <circle cx="820" cy="200" r="18" fill="#F7F3E9" opacity="0.5" />
    <circle cx="940" cy="330" r="10" fill="#F7F3E9" opacity="0.4" />
  </g>

  <!-- window mullions, off-centre -->
  <g stroke="#F7F3E9" stroke-width="6" opacity="0.55">
    <line x1="430" y1="0" x2="430" y2="800" />
    <line x1="0" y1="360" x2="1200" y2="360" />
  </g>

  <!-- rain streaks -->
  <g stroke="#F7F3E9" stroke-width="2" opacity="0.22">
    <line x1="120" y1="0" x2="60" y2="800" />
    <line x1="220" y1="0" x2="160" y2="800" />
    <line x1="340" y1="0" x2="290" y2="800" />
    <line x1="560" y1="0" x2="500" y2="800" />
    <line x1="700" y1="0" x2="650" y2="800" />
    <line x1="860" y1="0" x2="810" y2="800" />
    <line x1="1020" y1="0" x2="970" y2="800" />
    <line x1="1140" y1="0" x2="1090" y2="800" />
  </g>

  <!-- sill silhouette -->
  <rect x="0" y="700" width="1200" height="100" fill="#0C0C0D" />
  <rect x="0" y="694" width="1200" height="10" fill="#0C0C0D" opacity="0.9" />

  <rect width="1200" height="800" fill="url(#vignette)" />
  <rect width="1200" height="800" filter="url(#grain)" />
</svg>
